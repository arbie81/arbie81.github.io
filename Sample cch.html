<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Audio sample</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #ffffff;
      font-family: 'Helvetica Neue', 'Futura', sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Scaled-up version of the main page player: dotted circle with a triangle */
    .play-btn {
      --size: clamp(160px, 32vmin, 260px);
      width: var(--size);
      height: var(--size);
      box-sizing: border-box;
      border: calc(var(--size) * 0.04) dotted #000000;
      border-radius: 50%;
      background: none;
      padding: 0;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transform: rotate(-2deg);
      transition: border-color 0.3s ease;
    }

    .play-btn:hover {
      border-color: #EBFE58;
    }

    .play-btn:focus-visible {
      outline: 3px solid #000000;
      outline-offset: 8px;
    }

    .play-triangle {
      display: block;
      width: 0;
      height: 0;
      border-top: calc(var(--size) * 0.2) solid transparent;
      border-bottom: calc(var(--size) * 0.2) solid transparent;
      border-left: calc(var(--size) * 0.3) solid #000000;
      margin-left: calc(var(--size) * 0.06);
      transition: border-left-color 0.3s ease;
    }

    .play-btn:hover .play-triangle {
      border-left-color: #EBFE58;
    }

    .pause-bars {
      display: none;
      width: calc(var(--size) * 0.3);
      height: calc(var(--size) * 0.36);
      position: relative;
    }

    .pause-bars::before,
    .pause-bars::after {
      content: "";
      position: absolute;
      top: 0;
      background-color: #000000;
      width: calc(var(--size) * 0.08);
      height: calc(var(--size) * 0.36);
      transition: background-color 0.3s ease;
    }

    .pause-bars::before {
      left: calc(var(--size) * 0.06);
    }

    .pause-bars::after {
      right: calc(var(--size) * 0.06);
    }

    .play-btn:hover .pause-bars::before,
    .play-btn:hover .pause-bars::after {
      background-color: #EBFE58;
    }

    .playing .play-triangle {
      display: none;
    }

    .playing .pause-bars {
      display: block;
    }

    /* Thin progress line, click anywhere on it to jump */
    .progress {
      width: clamp(180px, 50vw, 360px);
      padding: 10px 0;
      margin-top: 48px;
      cursor: pointer;
    }

    .progress-line {
      height: 4px;
      background-color: #e6e6e6;
    }

    .progress-fill {
      height: 100%;
      width: 0;
      background-color: #000000;
    }
  </style>
</head>
<body>
  <button class="play-btn" id="playBtn" aria-label="Play">
    <span class="play-triangle"></span>
    <span class="pause-bars"></span>
  </button>

  <div class="progress" id="progress">
    <div class="progress-line"><div class="progress-fill" id="fill"></div></div>
  </div>

  <audio id="audio" src="cch.mp3" preload="metadata"></audio>

  <script>
    (function () {
      var audio = document.getElementById('audio');
      var btn = document.getElementById('playBtn');
      var bar = document.getElementById('progress');
      var fill = document.getElementById('fill');

      function update() {
        if (audio.duration) {
          fill.style.width = (audio.currentTime / audio.duration * 100) + '%';
        }
      }

      function setPlaying(isPlaying) {
        document.body.classList.toggle('playing', isPlaying);
        btn.setAttribute('aria-label', isPlaying ? 'Pause' : 'Play');
      }

      btn.addEventListener('click', function () {
        if (audio.paused) {
          var p = audio.play();
          if (p && p.catch) { p.catch(function () {}); }
        } else {
          audio.pause();
        }
      });

      audio.addEventListener('play', function () { setPlaying(true); });
      audio.addEventListener('pause', function () { setPlaying(false); });
      audio.addEventListener('ended', function () {
        audio.currentTime = 0;
        update();
        setPlaying(false);
      });
      audio.addEventListener('timeupdate', update);

      bar.addEventListener('click', function (e) {
        if (!audio.duration) { return; }
        var r = bar.getBoundingClientRect();
        var pct = Math.min(Math.max((e.clientX - r.left) / r.width, 0), 1);
        audio.currentTime = pct * audio.duration;
        update();
      });
    })();
  </script>
</body>
</html>
